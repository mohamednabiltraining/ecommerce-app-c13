name: ecommerce_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.2

dependencies:
  cached_network_image:
  carousel_slider_plus:
  flutter:
    sdk: flutter
  flutter_screenutil:
  flutter_slidable:
  auto_size_text:
  colornames:
  flutter_svg:
  flutter_native_splash:
  readmore:
  smooth_page_indicator:
  retrofit:
  logger:  # for logging purpose
  json_annotation:
  dio:
  # add injectable to your dependencies
  injectable:
  # add get_it
  get_it:
  pretty_dio_logger: ^1.4.0
  flutter_bloc:
  flutter_secure_storage: 9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:

  injectable_generator:
  retrofit_generator: '>=8.0.0 <10.0.0' # for Dart 3.3 use ^9.0.0
  build_runner: ^2.3.3
  json_serializable: ^6.8.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/svg_images/



  fonts:
     - family: Poppins
       fonts:
         - asset: assets/fonts/Poppins-.ttf



